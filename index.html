                <div className="wfield"><label>Светильники, шт</label>
                  <input type="text" inputMode="decimal" value={wizardForm.lights||''} onChange={e=>setWizardForm({...wizardForm,lights:e.target.value})}/></div>
                <div className="wfield"><label title="Плита, водонагреватель, стиральная/посудомоечная машина и т.п. — то, что обычно заводится отдельным кабелем большего сечения прямо от щита.">Мощная техника, шт</label>
                  <input type="text" inputMode="decimal" value={wizardForm.power||''} onChange={e=>setWizardForm({...wizardForm,power:e.target.value})}/></div>
                <div className="wfield"><label>Запас кабеля, %</label>
                  <input type="text" inputMode="decimal" value={wizardForm.waste||''} onChange={e=>setWizardForm({...wizardForm,waste:e.target.value})}/></div>
                <div className="wcheck"><label><input type="checkbox" checked={!!wizardForm.shtroblenie} onChange={e=>setWizardForm({...wizardForm,shtroblenie:e.target.checked})}/> Штробление стен</label></div>
                <div className="wcheck"><label><input type="checkbox" checked={!!wizardForm.gofra} onChange={e=>setWizardForm({...wizardForm,gofra:e.target.checked})}/> Прокладка в гофре</label></div>
                <div className="wnote">Освещение, розетки и мощная техника — это разные группы (каждая своим кабелем и отдельной трассой от щита), поэтому длина считается по каждой группе отдельно, а не одним общим кабелем на всё: (периметр × 1,2 + точек группы × 2,5 м) × (1 + запас) для освещения и розеток; для мощной техники — короче, как прямой заход (периметр × 0,6 + точек × 1,5 м) × (1 + запас). Штробление — ≈50% периметра. Это по-прежнему ориентировочный расчёт без учёта реального расположения щита и трасс — для коммерческой сметы сверьте с проектом электрики.</div>
              </>}
            </div>
            <div className="wizard-actions">
              <button className="wizard-save" onClick={()=>{
                if(wizardOpen==='styazhka') runStyazhkaWizard(wizardForm);
                else if(wizardOpen==='shtukaturka') runShtukaturkaWizard(wizardForm);
                else if(wizardOpen==='elektrika') runElektrikaWizard(wizardForm);
              }}>Добавить в смету</button>
              <button className="wizard-cancel" onClick={closeWizard}>Отмена</button>
            </div>
          </div>
        </div>}

      {invoiceOpen && invoiceForm &&
        <div className="wizard-overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) closeInvoice(); }}>
          <div className="wizard-modal">
            <div className="wizard-head">
              <h3>Счёт на оплату</h3>
              <button className="wizard-close" onClick={closeInvoice} aria-label="Закрыть">×</button>
            </div>
            <div className="wizard-body">
              <div className="wfield"><label>Номер документа</label>
                <input value={invoiceForm.number} onChange={e=>setInvoiceForm({...invoiceForm,number:e.target.value})}/></div>
              <div className="wfield"><label>Дата</label>
                <input type="date" value={invoiceForm.date} onChange={e=>setInvoiceForm({...invoiceForm,date:e.target.value})}/></div>
              <div className="wfield"><label>Поставщик (исполнитель)</label>
                <input value={invoiceForm.supplierName} onChange={e=>setInvoiceForm({...invoiceForm,supplierName:e.target.value})} placeholder="Название компании или ИП"/></div>
              <div className="wfield"><label>ИНН поставщика (необязательно)</label>
                <input value={invoiceForm.supplierInn} onChange={e=>setInvoiceForm({...invoiceForm,supplierInn:e.target.value})}/></div>
              <div className="wfield"><label>Покупатель (заказчик)</label>
                <input value={invoiceForm.buyerName} onChange={e=>setInvoiceForm({...invoiceForm,buyerName:e.target.value})} placeholder="Название компании, ИП или ФИО"/></div>
              <div className="wfield"><label>ИНН покупателя (необязательно)</label>
                <input value={invoiceForm.buyerInn} onChange={e=>setInvoiceForm({...invoiceForm,buyerInn:e.target.value})}/></div>
              <div className="wfield"><label>НДС</label>
                <div className="wtoggle">
                  <button type="button" className={invoiceForm.vatMode==='none'?'on':''} onClick={()=>setInvoiceForm({...invoiceForm,vatMode:'none'})}>Без НДС</button>
                  <button type="button" className={invoiceForm.vatMode==='included'?'on':''} onClick={()=>setInvoiceForm({...invoiceForm,vatMode:'included'})}>Включён в сумму</button>
                  <button type="button" className={invoiceForm.vatMode==='on_top'?'on':''} onClick={()=>setInvoiceForm({...invoiceForm,vatMode:'on_top'})}>Сверху</button>
                </div></div>
              {invoiceForm.vatMode!=='none' &&
                <div className="wfield"><label>Ставка НДС, %</label>
                  <input type="text" inputMode="decimal" value={invoiceForm.vatRate} onChange={e=>setInvoiceForm({...invoiceForm,vatRate:e.target.value})}/></div>}
              <div className="wnote">В счёт попадут все отмеченные позиции сметы по всем помещениям, объединённые по названию (без деления на помещения). Сумма — «Итого к оплате» из сметы, с учётом скидки клиенту, если она указана.</div>
            </div>
            <div className="wizard-actions">
              <button className="wizard-save" onClick={printInvoice}>Сформировать и распечатать</button>
              <button className="wizard-cancel" onClick={closeInvoice}>Отмена</button>
            </div>
          </div>
        </div>}

      {copyOpen &&
        <div className="wizard-overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) closeCopyModal(); }}>
          <div className="wizard-modal">
            <div className="wizard-head">
              <h3>Скопировать в другие помещения</h3>
              <button className="wizard-close" onClick={closeCopyModal} aria-label="Закрыть">×</button>
            </div>
            <div className="wizard-body">
              <div className="wnote">
                Будут скопированы отмеченные позиции из «{room.name}». Позиции с автоматическим количеством
                (по площади пола, периметру, площади стен и т.п.) пересчитаются под геометрию выбранного помещения.
                Позиции с вручную введённым количеством скопируются как есть — их стоит проверить отдельно.
              </div>
              {rooms.filter(r=>r.id!==room.id).length===0 &&
                <div className="wnote">Других помещений пока нет — сначала добавьте ещё одно.</div>}
              {rooms.filter(r=>r.id!==room.id).map(r=>(
                <label key={r.id} className="wcheck">
                  <input type="checkbox" checked={copyTargets.includes(r.id)} onChange={()=>toggleCopyTarget(r.id)}/> {r.name}
                </label>
              ))}
            </div>
            <div className="wizard-actions">
              <button className="wizard-save" onClick={runCopyToRooms}>Скопировать</button>
              <button className="wizard-cancel" onClick={closeCopyModal}>Отмена</button>
            </div>
          </div>
        </div>}

      {projectsOpen &&
        <div className="wizard-overlay" onMouseDown={e=>{ if(e.target===e.currentTarget) setProjectsOpen(false); }}>
          <div className="wizard-modal">
            <div className="wizard-head">
              <h3>Мои сметы</h3>
              <button className="wizard-close" onClick={()=>setProjectsOpen(false)} aria-label="Закрыть">×</button>
            </div>
            <div className="wizard-body">
              <div className="wnote">Все сметы хранятся в этом браузере на этом устройстве. Прайс-лист (цены, свои позиции) — общий на все сметы сразу.</div>
              <button className="btn-tool" onClick={newProject} style={{alignSelf:'flex-start'}}>+ Новая смета</button>
              {projects.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).map(p=>{
                const projSum = (p.rooms||[]).reduce((a,r)=>a+roomTotal(r).sum,0);
                const isActive = p.id===activeProjectId;
                return (
                  <div key={p.id} className={"project-row"+(isActive?' active':'')}>
                    <div className="project-info">
                      <div className="project-name">{p.name||'Без названия'}{isActive?' — текущая':''}</div>
                      <div className="project-meta">{(p.rooms||[]).length} помещ. · {fmt(projSum)} ₽ · {p.updatedAt?new Date(p.updatedAt).toLocaleDateString('ru-RU'):''}</div>
                    </div>
                    <div className="project-actions">
                      {!isActive && <button className="btn-tool" onClick={()=>switchProject(p.id)}>Открыть</button>}
                      <button className="btn-tool btn-newproj" onClick={()=>deleteProject(p.id)} title="Удалить смету" aria-label={`Удалить смету: ${p.name}`}>🗑</button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>}

      <div className={"print-only"+(printMode==='smeta'?' active':'')}>
        <div className="pr-page">
          <div className="pr-h1">Смета — {objName}</div>
          {objMeta.trim() && <div className="pr-sub" style={{marginBottom:2}}>{objMeta.trim()}</div>}
          <div className="pr-sub">Составлено {new Date().toLocaleDateString('ru-RU')} · только отмеченные позиции</div>
          {rooms.map((rm,i)=>{
            const cc = computed(rm); const items = totals[i].items;
            if(!items.length) return null;
            const groups = groupBySection(items);
            return (
              <div className="pr-room" key={rm.id}>
                <h3>{rm.name} — S пола {fmt2(cc.Sпола)} м², периметр {fmt2(cc.Периметр)} м, S стен {fmt2(cc.Sстен)} м²</h3>
                <table className="pr-table">
                  <thead><tr><th>Наименование</th><th>Ед.</th><th className="num">Кол-во</th><th className="num">Цена</th><th className="num">Сумма</th></tr></thead>
                  <tbody>
                    {groups.map(([section,groupItems])=>{
                      const groupSum = groupItems.reduce((a,it)=>a+(it.sum||0),0);
                      return (
                        <React.Fragment key={section}>
                          <tr className="pr-section-row"><td colSpan="5">{section}</td></tr>
                          {groupItems.map(it=>(
                            <tr key={it.id}>
                              <td>{it.name}</td><td>{it.unit}</td>
                              <td className="num">{fmt2(it.qty)}</td>
                              <td className="num">{it.price!=null?fmt(it.price):'—'}</td>
                              <td className="num">{it.sum!=null?fmt(it.sum):'—'}</td>
                            </tr>
                          ))}
                          <tr className="pr-section-subtotal"><td colSpan="4">Итого по разделу «{section}»</td><td className="num">{fmt(groupSum)} ₽</td></tr>
                        </React.Fragment>
                      );
                    })}
                    <tr className="pr-subtotal"><td colSpan="4">Итого по помещению</td><td className="num">{fmt(totals[i].sum)} ₽</td></tr>
                  </tbody>
                </table>
              </div>
            );
          })}
          {(()=>{
            const wts = workTypeSummary();
            if(!wts.length) return null;
            return (
              <div className="pr-room pr-worktypes">
                <h3>Свод по видам работ (все помещения)</h3>
                <table className="pr-table">
                  <thead><tr><th>Раздел</th><th className="num">Позиций</th><th className="num">Сумма</th></tr></thead>
                  <tbody>
                    {wts.map(w=>(
                      <tr key={w.section}>
                        <td>{w.section}</td>
                        <td className="num">{w.count}</td>
                        <td className="num">{fmt(w.sum)} ₽</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          })()}
          <div className="pr-grand">
            <div className="line"><span>Сумма работ</span><span>{fmt(grandWork)} ₽</span></div>
            <div className="line"><span>Сумма материалов</span><span>{fmt(grandMaterial)} ₽</span></div>
            <div className="line"><span>Итого по смете</span><span>{fmt(grand)} ₽</span></div>
            {discount>0 && <div className="line"><span>Скидка клиенту {discount}%</span><span>−{fmt(grand*discount/100)} ₽</span></div>}
            <div className="line total"><span>Итого к оплате</span><span>{fmt(withDiscount)} ₽</span></div>
            <div className="line words">{rubToWords(withDiscount)}</div>
          </div>
        </div>
      </div>

      {invoiceForm &&
        <div className={"print-only"+(printMode==='invoice'?' active':'')}>
          <div className="pr-page">
            <div className="pr-h1">Счёт № {invoiceForm.number} от {formatDateRu(invoiceForm.date)}</div>
            <div className="inv-parties">
              <div><b>Поставщик (исполнитель):</b> {invoiceForm.supplierName || '—'}{invoiceForm.supplierInn?` (ИНН ${invoiceForm.supplierInn})`:''}</div>
              <div><b>Покупатель (заказчик):</b> {invoiceForm.buyerName || '—'}{invoiceForm.buyerInn?` (ИНН ${invoiceForm.buyerInn})`:''}</div>
            </div>
            <table className="pr-table inv-table">
              <thead><tr><th>№</th><th>Наименование работ, услуг</th><th>Кол-во</th><th>Ед.</th><th>Цена</th><th>Сумма</th></tr></thead>
              <tbody>
                {invoiceItems().map((it,idx)=>(
                  <tr key={idx}>
                    <td className="num">{idx+1}</td>
                    <td>{it.name}</td>
                    <td className="num">{fmt2(it.qty)}</td>
                    <td>{it.unit}</td>
                    <td className="num">{it.price!=null?fmt(it.price):'—'}</td>
                    <td className="num">{it.sum!=null?fmt(it.sum):'—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            {(()=>{
              const {vat,payable} = invoiceVat(withDiscount, invoiceForm);
              return (
                <div className="pr-grand">
                  <div className="line"><span>Итого</span><span>{fmt(withDiscount)} ₽</span></div>
                  {invoiceForm.vatMode!=='none' &&
                    <div className="line"><span>{invoiceForm.vatMode==='included'?`В том числе НДС ${invoiceForm.vatRate}%`:`НДС ${invoiceForm.vatRate}% сверху`}</span><span>{fmt(vat)} ₽</span></div>}
                  <div className="line total"><span>Всего к оплате</span><span>{fmt(payable)} ₽</span></div>
                  <div className="line words">{rubToWords(payable)}</div>
                </div>
              );
            })()}
            <div className="inv-footer">
              Оплата данного счёта означает согласие с условиями поставки товаров/оказания услуг. Просим сохранять документ об оплате до полного исполнения обязательств сторонами.
            </div>
          </div>
        </div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./service-worker.js').catch(()=>{ /* офлайн-кеш не критичен для работы самого приложения */ });
    });
  }
</script>
</body>
</html>
