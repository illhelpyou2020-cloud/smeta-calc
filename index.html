<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Смета — калькулятор</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A2744">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Смета">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A2744; --ink-soft:#425073; --paper:#F7F8F5; --panel:#FFFFFF;
  --grid:#DCE1E8; --blue:#2F5AA8; --blue-soft:#EAF0FA; --red:#C1462F; --red-soft:#FBEAE6;
  --green:#3F7A57; --green-soft:#E9F3EC; --stamp:#1A2744;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
    var(--paper);
  color:var(--ink); font-family:'IBM Plex Sans',sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;}

.topbar{position:sticky;top:0;z-index:30;background:rgba(247,248,245,0.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--ink);}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 20px 0;}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.brand-mark{width:30px;height:30px;border:2px solid var(--ink);position:relative;flex-shrink:0;}
.brand-mark::before,.brand-mark::after{content:"";position:absolute;background:var(--ink);}
.brand-mark::before{left:50%;top:2px;bottom:2px;width:2px;margin-left:-1px;}
.brand-mark::after{top:50%;left:2px;right:2px;height:2px;margin-top:-1px;}
.brand h1{font:600 20px/1 'Space Grotesk',sans-serif;margin:0;letter-spacing:0.2px;}
.brand span{font:500 12px/1 'IBM Plex Mono',monospace;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.08em;}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:thin;}
.tabs-actions{display:flex;gap:8px;padding-bottom:12px;}
.tab{flex:0 0 auto;padding:8px 14px;border:1.5px solid var(--grid);border-bottom:none;border-radius:6px 6px 0 0;background:var(--panel);cursor:pointer;font:500 13.5px 'IBM Plex Sans',sans-serif;color:var(--ink-soft);display:flex;align-items:center;gap:8px;white-space:nowrap;}
.tab.active{border-color:var(--ink);color:var(--ink);background:var(--paper);font-weight:600;position:relative;top:1px;border-bottom:1px solid var(--paper);}
.tab .x{opacity:0.4;font-size:15px;line-height:1;padding:0 2px;}
.tab .x:hover{opacity:1;color:var(--red);}
.tab-add{flex:0 0 auto;width:34px;height:34px;border:1.5px dashed var(--grid);border-radius:6px;background:none;cursor:pointer;color:var(--ink-soft);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;}
.tab-add:hover{border-color:var(--blue);color:var(--blue);}
.tab-dup{flex:0 0 auto;height:34px;padding:0 12px;border:1.5px dashed var(--grid);border-radius:6px;background:none;cursor:pointer;color:var(--ink-soft);font-size:12.5px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;display:flex;align-items:center;gap:5px;}
.tab-dup:hover{border-color:var(--green);color:var(--green);}
.tab-copy{flex:0 0 auto;height:34px;padding:0 12px;border:1.5px dashed var(--grid);border-radius:6px;background:none;cursor:pointer;color:var(--ink-soft);font-size:12.5px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;display:flex;align-items:center;gap:5px;}
.tab-copy:hover{border-color:var(--blue);color:var(--blue);}
.topbar-tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}
.tools-toggle{display:none;} /* виден только на мобильном — см. медиа-запрос ниже */
.tools-extra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.save-indicator{font:500 11px 'IBM Plex Mono',monospace;color:var(--green);white-space:nowrap;}
.tools-group-label{font:600 10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);white-space:nowrap;margin-left:4px;}
.btn-tool{border:1.5px solid var(--grid);background:var(--panel);color:var(--ink-soft);border-radius:6px;padding:6px 12px;font:600 11.5px 'IBM Plex Sans',sans-serif;cursor:pointer;white-space:nowrap;}
.btn-tool:hover{border-color:var(--blue);color:var(--blue);}
.btn-tool:disabled{opacity:0.4;cursor:not-allowed;}
.btn-tool:disabled:hover{border-color:var(--grid);color:var(--ink-soft);}
.btn-newproj:hover{border-color:var(--red);color:var(--red);}

.params-wrap{border-bottom:1px solid var(--grid);}
.params{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;}
.openings-block{max-width:1180px;margin:0 auto;padding:0 20px 14px;}
.openings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.openings-label{font:600 11px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
.openings-add{display:flex;gap:8px;}
.openings-add button{border:1.5px dashed var(--grid);background:var(--panel);color:var(--ink-soft);border-radius:6px;padding:5px 12px;font:600 12px 'IBM Plex Sans',sans-serif;cursor:pointer;}
.openings-add button:hover{border-color:var(--blue);color:var(--blue);}
.openings-empty{font:400 12.5px 'IBM Plex Sans',sans-serif;color:var(--ink-soft);padding:6px 0;}
.opening-row{display:flex;align-items:center;gap:8px;padding:5px 0;}
.opening-type{width:76px;flex:0 0 auto;font:600 12px 'IBM Plex Sans',sans-serif;color:var(--ink-soft);}
.opening-type.door{color:#6B4A2B;}
.opening-type.window{color:#2F5AA8;}
.opening-row input{width:90px;border:1px solid var(--grid);border-radius:6px;padding:6px 8px;font:400 13px 'IBM Plex Mono',monospace;background:var(--paper);}
.opening-x{color:var(--ink-soft);font:400 13px 'IBM Plex Sans',sans-serif;}
.opening-area{flex:1;font:400 12px 'IBM Plex Mono',monospace;color:var(--ink-soft);}
.opening-del{border:none;background:none;color:var(--ink-soft);opacity:0.5;cursor:pointer;font-size:13px;padding:4px 6px;border-radius:5px;}
.opening-del:hover{opacity:1;color:var(--red);background:var(--red-soft);}
.openings-warn{margin-top:6px;font:500 11.5px 'IBM Plex Sans',sans-serif;color:var(--red);background:var(--red-soft);border-radius:6px;padding:6px 10px;line-height:1.5;}
.wizards-row{max-width:1180px;margin:0 auto;padding:0 20px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.wizards-label{font:600 11px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-right:2px;}
.wizard-btn{border:1.5px solid var(--grid);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 14px;font:600 12.5px 'IBM Plex Sans',sans-serif;cursor:pointer;}
.wizard-btn:hover{border-color:var(--blue);background:var(--blue-soft);}
.pfield{display:flex;flex-direction:column;gap:5px;position:relative;}
.pfield label{font:600 10px/1 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);}
.pfield input{width:92px;border:none;border-bottom:2px solid var(--ink);background:none;font:600 17px 'IBM Plex Mono',monospace;color:var(--ink);padding:2px 0;}
.pfield input:focus{outline:none;border-color:var(--blue);}
.pfield input.invalid{border-color:var(--red);color:var(--red);}
.pfield-error{position:absolute;top:100%;left:0;width:220px;font:400 11px 'IBM Plex Sans',sans-serif;color:var(--red);line-height:1.4;padding-top:3px;}
.pname{flex:1 1 220px;min-width:180px;}
.pname input{width:100%;font:600 17px 'Space Grotesk',sans-serif;border-bottom:2px solid var(--ink);border-top:none;border-left:none;border-right:none;background:none;padding:2px 0;}
.pname input:focus{outline:none;border-color:var(--blue);}
.pcalc{display:flex;flex-direction:column;gap:5px;}
.pcalc label{font:600 10px/1 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.08em;color:var(--green);}
.pcalc .val{font:600 17px 'IBM Plex Mono',monospace;color:var(--green);padding:2px 0;border-bottom:2px solid var(--green-soft);}

.view-tabs{border-bottom:1px solid var(--grid);background:var(--panel);}
.view-tabs-inner{max-width:1180px;margin:0 auto;padding:10px 20px 0;display:flex;gap:8px;}
.view-tabs button{border:1.5px solid var(--grid);border-bottom:none;background:var(--paper);color:var(--ink-soft);border-radius:8px 8px 0 0;padding:8px 16px;font:600 12.5px 'IBM Plex Sans',sans-serif;cursor:pointer;}
.view-tabs button.on{background:var(--panel);color:var(--ink);border-color:var(--ink);position:relative;top:1px;}
.selected-total{margin-top:16px;padding-top:14px;border-top:2px solid var(--ink);font:600 15px 'Space Grotesk',sans-serif;text-align:right;}
.filters-wrap{border-bottom:1px solid var(--grid);background:rgba(255,255,255,0.5);}
.filters{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.search-wrap{position:relative;flex:1 1 200px;min-width:160px;}
.search{width:100%;border:1.5px solid var(--grid);border-radius:20px;padding:7px 14px;font:400 13.5px 'IBM Plex Sans',sans-serif;background:var(--panel);}
.search-suggest{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1.5px solid var(--grid);border-radius:10px;box-shadow:0 10px 24px rgba(26,39,68,0.14);z-index:40;max-height:280px;overflow-y:auto;}
.search-suggest-item{padding:8px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--grid);}
.search-suggest-item:last-child{border-bottom:none;}
.search-suggest-item:hover{background:var(--blue-soft);}
.ss-name{font:500 13px 'IBM Plex Sans',sans-serif;color:var(--ink);}
.ss-meta{font:400 11px 'IBM Plex Mono',monospace;color:var(--ink-soft);white-space:nowrap;}
.search:focus{outline:none;border-color:var(--blue);}
.chip{border:1.5px solid var(--grid);border-radius:20px;padding:6px 13px;background:var(--panel);font:500 12.5px 'IBM Plex Sans',sans-serif;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.chip .n{opacity:0.65;font:500 11px 'IBM Plex Mono',monospace;margin-left:4px;}
.chip.warn{border-color:var(--red);color:var(--red);}

.addbar{max-width:1180px;margin:0 auto;padding:0 20px 12px;display:flex;gap:8px;}
.addbtn{border:1.5px dashed var(--blue);color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:7px 14px;font:600 12.5px 'IBM Plex Sans',sans-serif;cursor:pointer;}
.editform-modal{background:var(--panel);border-radius:14px;max-width:700px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.editform-body{padding:16px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.afield{display:flex;flex-direction:column;gap:4px;}
.afield label{font:600 10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);}
.afield input,.afield select{border:1px solid var(--grid);border-radius:6px;padding:7px 9px;font:400 13px 'IBM Plex Sans',sans-serif;background:var(--paper);}
.afield.name{flex:1 1 220px;}
.afield.unit{width:90px;} .afield.priv{width:130px;} .afield.price{width:110px;} .afield.sec{width:170px;} .afield.kind{width:150px;}
.kind-toggle{display:flex;gap:4px;}
.kind-toggle button{flex:1;padding:7px 0;border-radius:6px;border:1px solid var(--grid);background:var(--paper);font:600 11px 'IBM Plex Sans',sans-serif;cursor:pointer;color:var(--ink-soft);}
.kind-toggle button.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.aform-actions{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--grid);}
.aform-actions button{border:none;border-radius:8px;padding:10px 16px;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer;}
.btn-save{background:var(--blue);color:#fff;}
.btn-cancel{background:var(--grid);color:var(--ink-soft);}
.btn-reset{background:none;border:1px solid var(--red)!important;color:var(--red);}

.main{max-width:1180px;margin:0 auto;padding:18px 20px 100px;}
.section-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 8px;padding-bottom:6px;border-bottom:1.5px solid var(--ink);}
.stage-picker{margin-top:6px;}
.stage-picker-title{font:600 11px 'Space Grotesk',sans-serif;margin-bottom:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;}
.stage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.stage-card{text-align:left;border:1.5px solid var(--grid);border-radius:10px;padding:14px 16px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:5px;font-family:inherit;}
.stage-card:hover{border-color:var(--blue);background:var(--blue-soft);}
.stage-name{font:600 14px 'Space Grotesk',sans-serif;color:var(--ink);}
.stage-count{font:400 11.5px 'IBM Plex Mono',monospace;color:var(--ink-soft);}
.back-btn{border:none;background:none;color:var(--blue);font:600 12.5px 'IBM Plex Sans',sans-serif;cursor:pointer;padding:2px 0 12px;display:flex;align-items:center;gap:4px;}
.back-btn:hover{text-decoration:underline;}
.section-head:first-child{margin-top:4px;}
.section-num{font:600 12px 'IBM Plex Mono',monospace;color:var(--blue);}
.section-head h2{font:600 15px 'Space Grotesk',sans-serif;margin:0;letter-spacing:0.2px;}

.row{display:flex;flex-direction:column;gap:6px;padding:9px 6px;border-bottom:1px solid var(--grid);}
.row:hover{background:rgba(47,90,168,0.04);}
.row.checked{background:var(--blue-soft);}
.row.checked:hover{background:var(--blue-soft);}
.row.custom{background:var(--green-soft);}
.row.overridden{background:#FFFBF0;}
.row.highlight{background:var(--blue-soft);box-shadow:inset 0 0 0 2px var(--blue);transition:background 0.4s,box-shadow 0.4s;}
.rmain{display:flex;align-items:flex-start;gap:8px;}
.chk{width:18px;height:18px;border:2px solid var(--ink-soft);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--panel);flex:0 0 auto;margin-top:2px;}
.chk.on{background:var(--blue);border-color:var(--blue);color:#fff;font-size:13px;line-height:1;}
.chk:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.rname{flex:1 1 auto;font:400 13.5px 'IBM Plex Sans',sans-serif;line-height:1.35;}
.rname .badge{display:inline-block;margin-left:6px;font:600 9.5px 'IBM Plex Mono',monospace;color:var(--green);background:var(--green-soft);border-radius:4px;padding:1px 5px;vertical-align:middle;}
.rname .badge.edit{color:#8A6412;background:#FFF1CC;}
.ractions{display:flex;gap:2px;flex:0 0 auto;}
.rmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-left:26px;}
.runit{font:400 12px 'IBM Plex Mono',monospace;color:var(--ink-soft);min-width:30px;}
.rqty input{width:80px;border:1px solid var(--grid);border-radius:5px;padding:5px 6px;font:500 13px 'IBM Plex Mono',monospace;text-align:right;color:var(--ink);background:var(--panel);}
.rqty input:focus{outline:none;border-color:var(--blue);}
.rqty input.auto{color:var(--ink-soft);background:transparent;border-color:transparent;}
.rqty input.invalid{border-color:var(--red);background:var(--red-soft);color:var(--red);}
.rprice{font:400 13px 'IBM Plex Mono',monospace;color:var(--ink-soft);}
.rprice.missing{color:var(--red);font-weight:600;}
.rsum{font:600 13.5px 'IBM Plex Mono',monospace;margin-left:auto;}
.rsum.invalid{color:var(--red);font-weight:500;font-size:11.5px;}
.ricon{width:24px;height:24px;border:none;background:none;color:var(--ink-soft);opacity:0.55;cursor:pointer;font-size:14px;border-radius:5px;display:flex;align-items:center;justify-content:center;}
.ricon:hover{opacity:1;}
.ricon.edit:hover{color:var(--blue);background:var(--blue-soft);}
.ricon.del:hover{color:var(--red);background:var(--red-soft);}
.ricon.dup:hover{color:var(--green);background:var(--green-soft);}
.empty-hint{padding:30px 10px;text-align:center;color:var(--ink-soft);font:400 13.5px 'IBM Plex Sans',sans-serif;}

.hiddenpanel{max-width:1180px;margin:14px auto 0;padding:12px 20px;background:#FFF9EC;border:1.5px solid #E3B341;border-radius:10px;}
.hiddenpanel h3{margin:0 0 8px;font:600 13px 'Space Grotesk',sans-serif;}
.hiditem{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font:400 13px 'IBM Plex Sans',sans-serif;border-bottom:1px dashed #E3B341;}
.hiditem button{border:1px solid #E3B341;background:#fff;border-radius:5px;padding:4px 10px;font:600 11.5px 'IBM Plex Sans',sans-serif;cursor:pointer;color:#8A6412;}

/* ---------- stamp ---------- */
.stamp{position:fixed;right:20px;bottom:20px;width:300px;background:var(--stamp);color:#fff;border-radius:8px;box-shadow:0 10px 30px rgba(26,39,68,0.35);font-family:'IBM Plex Mono',monospace;overflow:hidden;z-index:40;transition:transform .15s ease;}
.stamp-head{padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,0.18);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.stamp-head .t{font:600 12px 'Space Grotesk',sans-serif;text-transform:uppercase;letter-spacing:0.08em;color:#9FB3D9;}
.stamp-head .v{font:600 15px 'Space Grotesk',sans-serif;margin-top:2px;}
.stamp-collapse-btn{flex:0 0 auto;width:24px;height:24px;border:1px solid rgba(255,255,255,0.3);background:none;color:#fff;border-radius:5px;cursor:pointer;font-size:12px;line-height:1;}
.stamp-collapse-btn:hover{background:rgba(255,255,255,0.12);}
.stamp-rooms{max-height:150px;overflow-y:auto;padding:8px 14px;}
.stamp-room{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:#C9D4EA;}
.stamp-room b{color:#fff;font-weight:500;}
.stamp-foot{padding:12px 14px 14px;border-top:1px solid rgba(255,255,255,0.18);}
.stamp-line{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:#C9D4EA;}
.stamp-line.total{font-size:16px;font-weight:600;color:#fff;padding-top:8px;margin-top:4px;border-top:1px dashed rgba(255,255,255,0.25);}
.stamp-line.words{font:italic 400 11px 'IBM Plex Sans',sans-serif;color:#9FB3D9;padding:2px 0 0;}
.discount-toggle{display:flex;gap:6px;margin:8px 0 2px;align-items:center;}
.discount-toggle button{flex:1;padding:5px 0;border-radius:5px;border:1px solid rgba(255,255,255,0.25);background:transparent;color:#C9D4EA;font:500 11px 'IBM Plex Mono',monospace;cursor:pointer;}
.discount-toggle button.on{background:#2F5AA8;color:#fff;border-color:#2F5AA8;}
.discount-custom{width:46px;flex:0 0 auto;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);border-radius:5px;color:#fff;text-align:center;padding:5px 2px;font:500 11px 'IBM Plex Mono',monospace;}
.discount-custom::placeholder{color:#7C8FB5;}
.stamp-meta-input{background:none;border:none;color:#9FB3D9;width:100%;padding:0;margin-top:4px;font:400 11px 'IBM Plex Sans',sans-serif;}
.stamp-meta-input::placeholder{color:#7C8FB5;}
.override-warn{width:100%;font:500 11.5px 'IBM Plex Sans',sans-serif;color:#8A6412;background:#FFF1CC;border-radius:6px;padding:6px 10px;margin:-2px 0 2px;}
.override-compare{width:100%;background:#FFF8E6;border:1px solid #FFE8A8;border-radius:8px;padding:10px 12px;margin:-2px 0 2px;}
.override-row{display:flex;justify-content:space-between;font:400 13px 'IBM Plex Sans',sans-serif;padding:3px 0;color:var(--ink-soft);}
.override-row b{font:600 13px 'IBM Plex Mono',monospace;color:var(--ink);}
.override-row b.cur{color:#8A6412;}
.stamp-actions{display:flex;gap:8px;padding:0 14px 14px;}
.stamp-actions button{flex:1;padding:8px 0;border-radius:6px;border:none;cursor:pointer;font:600 11.5px 'IBM Plex Sans',sans-serif;}
.act-print{background:#fff;color:var(--stamp);}
.act-copy{background:rgba(255,255,255,0.14);color:#fff;}
.act-invoice{background:rgba(255,255,255,0.14);color:#fff;}

.stamp-pill{position:fixed;right:20px;bottom:20px;background:var(--stamp);color:#fff;border-radius:24px;padding:10px 16px 10px 18px;box-shadow:0 8px 22px rgba(26,39,68,0.35);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:10px;cursor:pointer;z-index:40;border:none;}
.stamp-pill .lbl{font-size:10px;color:#9FB3D9;text-transform:uppercase;letter-spacing:0.06em;}
.stamp-pill .val{font:600 15px 'Space Grotesk',sans-serif;color:#fff;}
.stamp-pill .arr{color:#9FB3D9;font-size:13px;}

.print-only{display:none;}

.undo-toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;font:500 12.5px 'IBM Plex Sans',sans-serif;box-shadow:0 8px 22px rgba(26,39,68,0.35);z-index:50;max-width:90vw;}
.undo-toast button{background:none;border:1px solid rgba(255,255,255,0.4);color:#fff;border-radius:5px;padding:5px 12px;font:600 11.5px 'IBM Plex Sans',sans-serif;cursor:pointer;white-space:nowrap;}
.undo-toast button:hover{background:rgba(255,255,255,0.15);}

.wizard-overlay{position:fixed;inset:0;background:rgba(20,28,48,0.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
.wizard-modal{background:var(--panel);border-radius:14px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.wizard-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--grid);}
.wizard-head h3{font:600 16px 'Space Grotesk',sans-serif;margin:0;}
.wizard-close{border:none;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--ink-soft);padding:2px 6px;}
.wizard-close:hover{color:var(--red);}
.wizard-body{padding:16px 20px;display:flex;flex-direction:column;gap:12px;}
.wfield{display:flex;flex-direction:column;gap:4px;}
.wfield label{font:600 10.5px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);}
.wfield input{border:1px solid var(--grid);border-radius:6px;padding:8px 10px;font:400 13.5px 'IBM Plex Sans',sans-serif;background:var(--paper);}
.wtoggle{display:flex;gap:6px;}
.wtoggle button{flex:1;padding:8px 4px;border-radius:6px;border:1px solid var(--grid);background:var(--paper);font:600 12px 'IBM Plex Sans',sans-serif;cursor:pointer;color:var(--ink-soft);}
.wtoggle button.on{background:var(--blue);border-color:var(--blue);color:#fff;}
.wcheck label{display:flex;align-items:center;gap:8px;font:400 13px 'IBM Plex Sans',sans-serif;cursor:pointer;}
.wnote{font:400 11.5px 'IBM Plex Sans',sans-serif;color:var(--ink-soft);background:var(--paper);border-radius:8px;padding:10px 12px;line-height:1.5;}
.project-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--grid);border-radius:8px;}
.project-row.active{border-color:var(--blue);background:var(--blue-soft);}
.project-name{font:600 13px 'IBM Plex Sans',sans-serif;color:var(--ink);}
.project-meta{font:400 11.5px 'IBM Plex Mono',monospace;color:var(--ink-soft);margin-top:2px;}
.project-actions{display:flex;gap:6px;flex:0 0 auto;}
.wizard-actions{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--grid);}
.wizard-actions button{border:none;border-radius:8px;padding:10px 16px;font:600 13px 'IBM Plex Sans',sans-serif;cursor:pointer;}
.wizard-save{flex:1;background:var(--blue);color:#fff;}
.wizard-cancel{background:var(--paper);border:1.5px solid var(--grid)!important;color:var(--ink-soft);}

@media (max-width:820px){
  .ricon{width:32px;height:32px;font-size:16px;}
  .rmeta{gap:10px;}
  .stamp,.stamp-pill{left:12px;right:12px;bottom:12px;width:auto;}
  .params{gap:14px;} .pfield input{width:78px;}
  .topbar-tools{width:100%;justify-content:flex-start;gap:6px;}
  .btn-tool{padding:6px 9px;font-size:10.5px;}
  /* Панель инструментов выросла до 12+ элементов (Смета + Прайс-лист) — на мобильном .topbar
     прилипающий (position:sticky), и столько кнопок постоянно съедало весь экран при скролле.
     Сворачиваем всё, кроме Отменить/Повторить, за переключатель «⋯ Ещё». */
  .tools-toggle{display:inline-flex;border:1.5px solid var(--grid);background:var(--panel);color:var(--ink-soft);border-radius:6px;padding:6px 10px;font:600 10.5px 'IBM Plex Sans',sans-serif;cursor:pointer;}
  .tools-extra{display:none;width:100%;}
  .tools-extra.open{display:flex;}
  /* Редактор проёмов не влезал одной строкой на узком экране — сжимаем фиксированные элементы
     и добавляем перенос как страховку, вместо горизонтального переполнения всей страницы. */
  .opening-row{flex-wrap:wrap;row-gap:6px;}
  .opening-type{width:54px;font-size:11px;}
  .opening-row input{width:62px;}
  .opening-area{font-size:11px;min-width:52px;}
  .opening-del{width:32px;height:32px;font-size:15px;padding:0;display:flex;align-items:center;justify-content:center;}
  /* «⧉ Дублировать» и «📋 Скопировать в...» были в конце скроллящейся ленты вкладок — переносим
     в отдельный, всегда видимый ряд под ней. */
  .tabs-actions{flex-wrap:wrap;}
  /* Три кнопки итогов теснились на самых узких экранах — «Счёт на оплату» переносим на свою строку. */
  .stamp-actions{flex-wrap:wrap;}
  .act-invoice{flex:1 1 100%;}
  /* Тройные переключатели (например, НДС) — компактнее, чтобы длинный текст не разваливал модалку. */
  .wtoggle button{font-size:10.5px;padding:8px 2px;}
}
@media print{
  body{background:#fff;}
  .topbar,.params-wrap,.filters-wrap,.addbar,.main,.stamp,.stamp-pill,.hiddenpanel,.wizard-overlay,.undo-toast{display:none!important;}
  .print-only.active{display:block!important;}
  .pr-page{max-width:800px;margin:0 auto;padding:16px;font-family:'IBM Plex Sans',sans-serif;color:#111;}
  .pr-h1{font:700 22px 'Space Grotesk',sans-serif;margin:0 0 2px;}
  .pr-sub{font:400 12px 'IBM Plex Mono',monospace;color:#555;margin-bottom:18px;}
  .pr-room{margin-top:18px;page-break-inside:avoid;}
  .pr-room h3{font:600 14px 'Space Grotesk',sans-serif;margin:0 0 6px;padding-bottom:4px;border-bottom:1.5px solid #111;}
  .pr-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .pr-table th{text-align:left;font:600 10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.04em;color:#555;border-bottom:1px solid #ccc;padding:4px 4px;}
  .pr-table td{padding:4px 4px;border-bottom:1px solid #eee;font-family:'IBM Plex Sans',sans-serif;}
  .pr-table td.num{font-family:'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;}
  .pr-subtotal td{font-weight:600;border-top:1.5px solid #111;border-bottom:none;}
  .pr-section-row td{font:700 10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;color:#555;background:#f4f4f4;border-bottom:1px solid #ddd;padding-top:7px;}
  .pr-section-subtotal td{font-style:italic;font-size:11px;color:#555;border-top:1px solid #ccc;border-bottom:1.5px solid #eee;}
  .pr-worktypes{margin-top:26px;border-top:2px solid #111;padding-top:10px;}
  .pr-grand{margin-top:22px;padding-top:12px;border-top:2px solid #111;}
  .pr-grand .line{display:flex;justify-content:space-between;font:400 13px 'IBM Plex Sans',sans-serif;padding:3px 0;}
  .pr-grand .line.total{font:700 17px 'Space Grotesk',sans-serif;padding-top:6px;}
  .pr-grand .line.words{display:block;font:italic 400 12px 'IBM Plex Sans',sans-serif;color:#444;padding-top:4px;}
  .inv-parties{margin:14px 0 18px;display:flex;flex-direction:column;gap:4px;font:400 13px 'IBM Plex Sans',sans-serif;}
  .inv-table{margin-top:6px;}
  .inv-footer{margin-top:20px;padding-top:12px;border-top:1px solid #ccc;font:400 11px 'IBM Plex Sans',sans-serif;color:#555;line-height:1.5;}
}
</style>

// Если найден только старый формат (одна смета) — превращает её в первую запись списка.

// Возвращает ВСЕГДА полностью готовую структуру (никогда null), чтобы не гонять эту логику по разным местам.
function loadSavedState(){
  try{
    const raw = localStorage.getItem(PROJECTS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.projects) && parsed.projects.length){
        const projects = parsed.projects.map(p=>({...p, rooms:(p.rooms||[]).map(migrateRoom)}));
        const activeProjectId = parsed.activeProjectId && projects.some(p=>p.id===parsed.activeProjectId)

    }
  }catch(e){}

    const raw = localStorage.getItem(LEGACY_KEY);
    if(raw){
      const parsed = JSON.parse(raw);

const fmt = n => n==null||isNaN(n) ? '' : n.toLocaleString('ru-RU',{maximumFractionDigits:0});

const plain2 = n => n==null||isNaN(n) ? '' : String(Math.round(n*100)/100);
// Российский пользователь часто вводит дробные числа через запятую (24,5).
// Все места, где парсится число из пользовательского текстового поля, должны идти через toNum.
const toNum = s => {
  if(s==null) return NaN;
  const cleaned = String(s).trim().replace(',', '.');
  return cleaned===''?NaN:parseFloat(cleaned);
};

// «Сумма прописью» — перевод суммы в рублях в текст, как на официальных счетах/актах.
function pluralRu(n, forms){
  const abs = Math.abs(Math.round(n));
  const n100 = abs % 100;
  const n10 = abs % 10;
  if(n100>10 && n100<20) return forms[2];
  if(n10>1 && n10<5) return forms[1];
  if(n10===1) return forms[0];
  return forms[2];
}

  const ONES_M=['','один','два','три','четыре','пять','шесть','семь','восемь','девять'];
  const ONES_F=['','одна','две','три','четыре','пять','шесть','семь','восемь','девять'];
  const TEENS=['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
  const TENS=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
  const HUNDREDS=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
  function threeDigits(num, feminine){
    const words=[];
    const h=Math.floor(num/100), rest=num%100;
    if(h) words.push(HUNDREDS[h]);
    if(rest>=10 && rest<20){ words.push(TEENS[rest-10]); }
    else{
      const t=Math.floor(rest/10), o=rest%10;
      if(t) words.push(TENS[t]);
      if(o) words.push(feminine?ONES_F[o]:ONES_M[o]);
    }
    return words;
  }
  if(amount==null || isNaN(amount)) return '';
  const neg = amount<0;
  const abs = Math.abs(Math.round(amount*100)/100);
  const rub = Math.floor(abs);
  const kop = Math.round((abs-rub)*100);
  const billions=Math.floor(rub/1e9)%1000, millions=Math.floor(rub/1e6)%1000, thousands=Math.floor(rub/1e3)%1000, ones=rub%1000;
  let parts=[];
  if(billions){ parts.push(...threeDigits(billions,false), pluralRu(billions,['миллиард','миллиарда','миллиардов'])); }
  if(millions){ parts.push(...threeDigits(millions,false), pluralRu(millions,['миллион','миллиона','миллионов'])); }
  if(thousands){ parts.push(...threeDigits(thousands,true), pluralRu(thousands,['тысяча','тысячи','тысяч'])); }
  if(ones){ parts.push(...threeDigits(ones,false)); }
  else if(!billions && !millions && !thousands){ parts.push('ноль'); }
  parts.push(pluralRu(rub,['рубль','рубля','рублей']));
  parts.push(String(kop).padStart(2,'0'), pluralRu(kop,['копейка','копейки','копеек']));
  let text = parts.filter(Boolean).join(' ');
  let full = (neg?'минус ':'') + text;
  full = full.charAt(0).toUpperCase()+full.slice(1);
  return full;
}

function formatDateRu(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  if(!y||!m||!d) return iso;
  const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return `${d} ${MONTHS[m-1]||''} ${y} г.`;
}

// Приводит помещение к текущему формату: старые сметы хранили два обобщённых числа
// (S проёмов, Ширина проёмов) вместо списка дверей/окон. Превращаем их в один «дверной»
// проём с той же шириной и площадью — это сохраняет прежние суммы расчёта без изменений
// для уже существующих смет, а новые проёмы дальше редактируются по отдельности.
function migrateRoom(room){
  if(Array.isArray(room.openings)) return room;
  const oldWp = toNum(room.Wпроемов)||0;
  const oldSp = toNum(room.Sпроемов)||0;
  const openings=[];
  if(oldWp>0){
    const height = oldSp>0 ? Math.round((oldSp/oldWp)*100)/100 : 2.1;
    openings.push(newOpening('дверь', String(oldWp), String(height)));
  }
  const {Sпроемов,Wпроемов,...rest} = room;
  return {...rest, openings};
}
function computed(room){
  const P=toNum(room.Периметр)||0,H=toNum(room.H)||0,S=toNum(room.Sпола)||0;
  const openings = room.openings||[];
  let Sp=0, doorWidths=0, openingsPerimeter=0;
  openings.forEach(o=>{
    const w=toNum(o.width)||0, h=toNum(o.height)||0;
    Sp += w*h;
    if(o.type==='дверь') doorWidths += w;
    openingsPerimeter += (2*h + w); // периметр отделки откоса: с трёх сторон (у окна снизу подоконник, у двери снизу пол)
  });
  const maxSp = P*H; // максимально возможная площадь проёмов — площадь стен по периметру без вычета
  const maxWp = P;   // максимально возможная суммарная ширина дверей — весь периметр
  return {
    Sпола:S, Периметр:P, H,
    Sстен: Math.max(0,P*H-Sp),
    Плинтус: Math.max(0,P-doorWidths), // вычитаются только двери — окно не доходит до пола и плинтус не прерывает
    Sпроемов:Sp, Wпроемов:doorWidths, Откосы:openingsPerimeter, КолПроемов:openings.length,
    maxSp, maxWp,
    sOpeningsInvalid: P>0 && H>0 && Sp>maxSp,
    wOpeningsInvalid: P>0 && doorWidths>maxWp,
  };
}

  if(priv==='Откосы') return c.Откосы;
  if(priv==='Кол-во проёмов') return c.КолПроемов;
  return null;
}
const emptyForm = {name:'',unit:'м2',priv:'Sпола',price:'',tag:'Прочее',kind:'work'};

function App(){

  const [stampOpen,setStampOpen] = useState(true);
  const [toolsExpanded,setToolsExpanded] = useState(false); // на мобильном панель инструментов свёрнута по умолчанию — иначе съедает весь экран (topbar прилипающий)
  const [projectsOpen,setProjectsOpen] = useState(false); // модалка «Мои сметы»
  const [lastSaved,setLastSaved] = useState(null);

  // Синхронизация: как только меняется рабочее состояние текущей сметы — обновляем её запись
  // в общем списке проектов (список — это то, что реально сохраняется и показывается в «Мои сметы»).
  useEffect(()=>{
    setProjects(ps=>ps.map(p=>p.id===activeProjectId ? {...p, name:objName, rooms, discount, objMeta, active, updatedAt:Date.now()} : p));
  },[rooms,discount,objName,objMeta,active,activeProjectId]);

  useEffect(()=>{
    const state = {version:2, overrides, customRows, hidden, projects, activeProjectId, savedAt:Date.now()};
    try{
      localStorage.setItem(PROJECTS_KEY, JSON.stringify(state));
      setLastSaved(state.savedAt);
    }catch(e){ /* хранилище недоступно или переполнено — работа продолжается без сохранения */ }
  },[overrides,customRows,hidden,projects,activeProjectId]);

  // ---- Undo/redo (Ctrl+Z / Ctrl+Shift+Z): история снимков состава сметы. Не трогает чисто
  // навигационные вещи (какая вкладка/раздел открыты) — только то, что реально меняет смету. ----
  const historyRef = useRef({past:[], future:[]});
  const currentSnapshotRef = useRef(null);
  const isRestoringRef = useRef(false);
  const pendingBaseRef = useRef(null);
  const historyDebounceRef = useRef(null);
  const [historyTick,setHistoryTick] = useState(0);
  function snapshotNow(){ return {customRows,overrides,hidden,rooms,discount,objName,objMeta}; }
  function applySnapshot(snap){
    setCustomRows(snap.customRows); setOverrides(snap.overrides); setHidden(snap.hidden);
    setRooms(snap.rooms); setDiscount(snap.discount); setObjName(snap.objName); setObjMeta(snap.objMeta);
    setActive(a=>Math.min(Math.max(a,0), snap.rooms.length-1)); // защита: rooms могли стать короче/длиннее, чем текущая активная вкладка
  }
  function flushPendingHistory(){
    if(historyDebounceRef.current){ clearTimeout(historyDebounceRef.current); historyDebounceRef.current=null; }
    if(pendingBaseRef.current!==null){
      historyRef.current.past.push(pendingBaseRef.current);
      if(historyRef.current.past.length>50) historyRef.current.past.shift();
      historyRef.current.future = [];
      pendingBaseRef.current = null;
    }
  }
  useEffect(()=>{
    const snap = snapshotNow();
    if(currentSnapshotRef.current===null){ currentSnapshotRef.current=snap; return; } // самый первый рендер — не история, а точка отсчёта
    if(isRestoringRef.current){ isRestoringRef.current=false; currentSnapshotRef.current=snap; return; } // это сам undo/redo — не пишем его как новое изменение
    if(pendingBaseRef.current===null) pendingBaseRef.current = currentSnapshotRef.current; // запомнили состояние до текущей "пачки" правок (например, до начала ввода в поле)
    currentSnapshotRef.current = snap;
    if(historyDebounceRef.current) clearTimeout(historyDebounceRef.current);
    historyDebounceRef.current = setTimeout(()=>{
      historyRef.current.past.push(pendingBaseRef.current);
      if(historyRef.current.past.length>50) historyRef.current.past.shift();
      historyRef.current.future = [];
      pendingBaseRef.current = null;
      historyDebounceRef.current = null;
      setHistoryTick(v=>v+1);
    }, 700); // группируем быстрые правки подряд (например, ввод числа посимвольно) в один шаг отмены
  },[customRows,overrides,hidden,rooms,discount,objName,objMeta]);
  function undo(){
    flushPendingHistory();
    const h = historyRef.current;
    if(h.past.length===0) return;
    const prev = h.past.pop();
    h.future.push(currentSnapshotRef.current);
    isRestoringRef.current = true;
    applySnapshot(prev);
    setHistoryTick(v=>v+1);
  }
  function redo(){
    flushPendingHistory();
    const h = historyRef.current;
    if(h.future.length===0) return;
    const next = h.future.pop();
    h.past.push(currentSnapshotRef.current);
    isRestoringRef.current = true;
    applySnapshot(next);
    setHistoryTick(v=>v+1);
  }
  useEffect(()=>{
    function onKeyDown(e){
      if(!(e.ctrlKey||e.metaKey)) return;
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      const isEditableFocus = tag==='INPUT' || tag==='TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable);
      if(isEditableFocus) return; // отдаём браузеру нативный undo/redo текстового поля, если фокус внутри инпута
      if(e.key==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
      else if((e.key==='z' && e.shiftKey) || e.key==='y'){ e.preventDefault(); redo(); }
    }
    window.addEventListener('keydown', onKeyDown);
    return ()=>window.removeEventListener('keydown', onKeyDown);
  },[]);
  const canUndo = historyRef.current.past.length>0 || pendingBaseRef.current!==null;
  const canRedo = historyRef.current.future.length>0;

  // ---- Клавиатурная навигация по списку позиций: стрелки перемещают фокус между чекбоксами
  // строк (тот же принцип, что в таблицах — "roving tabindex"), Home/End — к первой/последней
  // видимой строке. Space/Enter уже переключают чекбокс (обработчик на самой строке). ----
  useEffect(()=>{
    function onKeyDown(e){
      const active = document.activeElement;
      if(!active || !active.classList || !active.classList.contains('chk')) return; // работаем только когда фокус уже на чекбоксе строки
      if(!['ArrowDown','ArrowUp','Home','End'].includes(e.key)) return;
      const all = Array.from(document.querySelectorAll('.main .chk'));
      const idx = all.indexOf(active);
      if(idx===-1) return;
      e.preventDefault();
      let nextIdx = idx;
      if(e.key==='ArrowDown') nextIdx = Math.min(idx+1, all.length-1);
      else if(e.key==='ArrowUp') nextIdx = Math.max(idx-1, 0);
      else if(e.key==='Home') nextIdx = 0;
      else if(e.key==='End') nextIdx = all.length-1;
      const target = all[nextIdx];
      target.focus();
      target.scrollIntoView({block:'center', behavior:'smooth'});
    }
    window.addEventListener('keydown', onKeyDown);
    return ()=>window.removeEventListener('keydown', onKeyDown);
  },[]);

  const skipUnloadWarnRef = useRef(false); // зарезервировано на случай, если снова понадобится программный reload/переход в обход предупреждения браузера
  useEffect(()=>{
    const onBeforeUnload = e=>{
      if(skipUnloadWarnRef.current) return;
      const hasData = rooms.some(r=>Object.values(r.picks||{}).some(p=>p&&p.on));

  // «Новый проект» сбрасывает только сам объект (помещения, позиции, скидку) — прайс-лист
  // (изменённые цены, свои позиции, скрытые из каталога) переживает любое количество проектов,
  // так как это наработка сметчика, а не часть конкретной сметы.
  // «Мои сметы»: каждый проект хранит своё состояние (помещения, позиции, скидка, название) отдельно
  // от прайс-листа (он общий на все проекты). Переключение между проектами обязательно сбрасывает
  // историю undo/redo — она принадлежит только одному проекту одновременно, иначе Ctrl+Z после
  // переключения мог бы затереть данные ДРУГОГО проекта.
  function loadProjectIntoState(target){
    historyRef.current = {past:[], future:[]};

      setObjName(data.objName || 'Объект без названия');

  function exportPriceList(){

  const importPriceListInputRef = useRef(null);

  function handleImportPriceListFile(e){

    e.target.value = '';
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let data;
      try{
        data = JSON.parse(reader.result);
        if(!data || typeof data!=='object' || data.kind!=='pricelist') throw new Error('bad format');
      }catch(err){
        alert('Не удалось прочитать файл. Убедитесь, что это файл прайс-листа, экспортированный из этой же программы (кнопка «Экспорт прайс-листа»).');
        return;
      }
      const hasCurrentCustomizations = Object.keys(overrides).length>0 || customRows.length>0 || Object.keys(hidden).length>0;
      if(hasCurrentCustomizations && !window.confirm('Импортировать прайс-лист из файла? Ваши текущие изменённые цены, добавленные позиции и скрытые из каталога будут заменены содержимым файла.')) return;
      const importedCustom = Array.isArray(data.customRows) ? data.customRows : [];
      const maxId = importedCustom.reduce((m,r)=>Math.max(m,r[0]),customSeq-1);
      customSeq = maxId+1;
      setOverrides(data.overrides && typeof data.overrides==='object' ? data.overrides : {});
      setCustomRows(importedCustom);
      setHidden(data.hidden && typeof data.hidden==='object' ? data.hidden : {});
    };
    reader.readAsText(file);
  }

  // ---- Экспорт/импорт прайс-листа в Excel — удобно массово править цены (лист «Каталог»,
  // строка на каждую из 212 позиций с ценой по умолчанию и полем «Ваша цена») и добавлять
  // свои позиции (лист «Свои позиции»), не щёлкая по одной в интерфейсе. ----
  function exportPriceListExcel(){
    if(typeof XLSX==='undefined'){
      alert('Не удалось загрузить библиотеку Excel-экспорта. Проверьте подключение к интернету и попробуйте снова.');
      return;
    }
    const wb = XLSX.utils.book_new();
    const catalogRows = [['ID','Раздел','Название (исходное)','Ед. изм. (исходное)','Цена по умолчанию','Ваша цена','Скрыть (да/пусто)']];
    BASE_CATALOG.forEach(r=>{
      const [id,section,name,unit,,defPrice] = r;
      const ov = overrides[id];
      const yourPrice = ov && ov.price!=null ? ov.price : '';
      catalogRows.push([id, section, name, unit, defPrice!=null?defPrice:'', yourPrice, hidden[id]?'да':'']);
    });
    const catalogSheet = XLSX.utils.aoa_to_sheet(catalogRows);
    catalogSheet['!cols'] = [{wch:6},{wch:22},{wch:42},{wch:10},{wch:14},{wch:12},{wch:14}];
    XLSX.utils.book_append_sheet(wb, catalogSheet, 'Каталог');

    const customSheetRows = [['Название','Ед. изм.','Привязка','Цена','Тип (работа/материал)','Тег']];
    customRows.forEach(r=>{
      const [,,name,unit,priv,price,tag,kind] = r;
      customSheetRows.push([name, unit, priv, price!=null?price:'', kind==='material'?'материал':'работа', tag||'']);
    });
    const customSheet = XLSX.utils.aoa_to_sheet(customSheetRows);
    customSheet['!cols'] = [{wch:42},{wch:10},{wch:14},{wch:12},{wch:18},{wch:18}];
    XLSX.utils.book_append_sheet(wb, customSheet, 'Свои позиции');

    XLSX.writeFile(wb, `pricelist_${new Date().toISOString().slice(0,10)}.xlsx`);
  }
  const importPriceListExcelInputRef = useRef(null);
  function triggerImportPriceListExcel(){ importPriceListExcelInputRef.current && importPriceListExcelInputRef.current.click(); }
  function handleImportPriceListExcel(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file) return;
    if(typeof XLSX==='undefined'){
      alert('Не удалось загрузить библиотеку Excel. Проверьте подключение к интернету и попробуйте снова.');
      return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      let wb;
      try{
        wb = XLSX.read(new Uint8Array(reader.result), {type:'array'});
      }catch(err){
        alert('Не удалось прочитать файл. Убедитесь, что это .xlsx файл прайс-листа, экспортированный из этой же программы.');
        return;
      }
      const catalogSheet = wb.Sheets['Каталог'];
      const customSheet = wb.Sheets['Свои позиции'];
      if(!catalogSheet && !customSheet){
        alert('В файле не найдены листы «Каталог» или «Свои позиции». Убедитесь, что это файл прайс-листа, экспортированный из этой же программы.');
        return;
      }
      const hasCurrentCustomizations = Object.keys(overrides).length>0 || customRows.length>0 || Object.keys(hidden).length>0;
      if(hasCurrentCustomizations && !window.confirm('Импортировать прайс-лист из Excel? Текущие изменённые цены, свои позиции и скрытые из каталога будут заменены содержимым файла. Если старые «свои» позиции уже отмечены в текущей смете — после замены они получат новые номера и пропадут из расчёта, это стоит проверить.')) return;

      const newOverrides = {};
      const newHidden = {};
      let skipped = 0;
      if(catalogSheet){
        const rows = XLSX.utils.sheet_to_json(catalogSheet, {header:1, range:1});
        rows.forEach(row=>{
          if(!row || row.length===0) return;
          const id = toNum(row[0]);
          if(isNaN(id)) return;
          const baseRow = BASE_CATALOG.find(r=>r[0]===id);
          if(!baseRow){ skipped++; return; }
          const hideRaw = row[6];
          if(hideRaw!=null && String(hideRaw).trim().toLowerCase().startsWith('д')) newHidden[id]=true;
          const priceRaw = row[5];
          if(priceRaw!=null && String(priceRaw).trim()!==''){
            const priceVal = toNum(String(priceRaw));
            if(!isNaN(priceVal) && priceVal>=0){
              newOverrides[id] = {name:baseRow[2], unit:baseRow[3], priv:baseRow[4], price:priceVal, tag:baseRow[6], kind:(overrides[id]&&overrides[id].kind)||'work'};
            } else { skipped++; }
          }
        });
      }
      const newCustomRows = [];
      if(customSheet){
        const rows = XLSX.utils.sheet_to_json(customSheet, {header:1, range:1});
        rows.forEach(row=>{
          if(!row || row[0]==null || String(row[0]).trim()==='') return;
          const name = String(row[0]).trim();
          const unit = row[1]!=null && String(row[1]).trim()!=='' ? String(row[1]).trim() : 'шт';
          const priv = row[2]!=null && String(row[2]).trim()!=='' && PRIV_OPTIONS.includes(String(row[2]).trim()) ? String(row[2]).trim() : '—';
          let priceVal = null;
          if(row[3]!=null && String(row[3]).trim()!==''){
            const parsed = toNum(String(row[3]));
            if(!isNaN(parsed) && parsed>=0) priceVal = parsed; else skipped++;
          }
          const kindRaw = row[4]!=null ? String(row[4]).trim().toLowerCase() : '';
          const kind = kindRaw.startsWith('матер') ? 'material' : 'work';
          const tag = row[5]!=null && String(row[5]).trim()!=='' ? String(row[5]).trim() : 'Прочее';
          newCustomRows.push([customSeq++, CUSTOM_SECTION, name, unit, priv, priceVal, tag, kind]);
        });
      }
      setOverrides(newOverrides);
      setHidden(newHidden);
      setCustomRows(newCustomRows);
      alert(`Прайс-лист импортирован: ${Object.keys(newOverrides).length} изменённых цен, ${Object.keys(newHidden).length} скрытых позиций, ${newCustomRows.length} своих позиций.`+(skipped>0?` Пропущено строк с ошибками: ${skipped}.`:''));
    };
    reader.readAsArrayBuffer(file);
  }

  function duplicateRoom(){
    setRooms(rs=>{
      const src = rs[active];
      const copy = {...src, id:Math.random().toString(36).slice(2), name:src.name+' (копия)',
        openings:(src.openings||[]).map(o=>({...o})),
        picks:JSON.parse(JSON.stringify(src.picks||{}))};
      return [...rs, copy];
    });
    setActive(rooms.length);

  // ---- Копирование отмеченных позиций в другие помещения. Позиции с автоматическим количеством
  // (по площади/периметру/др.) пересчитаются сами — качество копируем как есть (''), а не число,
  // так что при рендере в целевой комнате оно возьмётся из ЕЁ собственной геометрии. Позиции с
  // вручную введённым количеством копируются буквально — их нельзя осмысленно пересчитать. ----
  function openCopyModal(){ setCopyTargets([]); setCopyOpen(true); }
  function closeCopyModal(){ setCopyOpen(false); }
  function toggleCopyTarget(roomId){
    setCopyTargets(ts=> ts.includes(roomId) ? ts.filter(id=>id!==roomId) : [...ts, roomId]);
  }
  function runCopyToRooms(){
    if(copyTargets.length===0){ alert('Выберите хотя бы одно помещение.'); return; }
    const pickedEntries = Object.entries(room.picks).filter(([,p])=>p&&p.on);
    if(pickedEntries.length===0){ alert('В этом помещении нет отмеченных позиций для копирования.'); return; }
    const manualCount = pickedEntries.filter(([,p])=>p.qty!=='' && p.qty!=null).length;
    const targetNames = rooms.filter(r=>copyTargets.includes(r.id)).map(r=>r.name).join(', ');
    const prevSnapshot = rooms.filter(r=>copyTargets.includes(r.id)).map(r=>({id:r.id, picks:{...r.picks}}));
    setRooms(rs=>rs.map(r=>{
      if(!copyTargets.includes(r.id)) return r;
      const picks={...r.picks};
      pickedEntries.forEach(([id,p])=>{ picks[id] = {on:true, qty:p.qty}; });
      return {...r, picks};
    }));
    showUndo(
      `Скопировано ${pickedEntries.length} поз. в «${targetNames}»`+(manualCount>0?` — ${manualCount} с ручным количеством, проверьте`:''),
      ()=>{ setRooms(rs=>rs.map(r=>{ const snap=prevSnapshot.find(s=>s.id===r.id); return snap?{...r,picks:snap.picks}:r; })); }
    );
    closeCopyModal();
  }

  // ---- Undo-тост: используется вместо блокирующих confirm() для удаления позиций/помещений ----
  const undoTimerRef = useRef(null);
  const [undoState,setUndoState] = useState(null); // {message, onUndo}
  function showUndo(message,onUndo){
    if(undoTimerRef.current) clearTimeout(undoTimerRef.current);
    setUndoState({message,onUndo});
    undoTimerRef.current = setTimeout(()=>{ setUndoState(null); undoTimerRef.current=null; }, 7000);
  }
  function handleUndoClick(){
    if(undoTimerRef.current){ clearTimeout(undoTimerRef.current); undoTimerRef.current=null; }
    if(undoState && undoState.onUndo) undoState.onUndo();
    setUndoState(null);
  }

  const ALL_ROWS = useMemo(()=>{
    const base = BASE_CATALOG.map(r => {
      const ov = overrides[r[0]];
      if(ov) return [r[0], r[1], ov.name, ov.unit, ov.priv, ov.price, ov.tag, ov.kind||'work'];
      return r.length>=8 ? r : [...r,'work'];
    });
    const custom = customRows.map(r=> r.length>=8 ? r : [...r,'work']); // старые импортированные позиции без поля "тип" — по умолчанию считаются работой
    return [...base, ...custom];
  },[overrides,customRows]);
  const visibleRows = useMemo(()=>ALL_ROWS.filter(r=>!hidden[r[0]]),[ALL_ROWS,hidden]);
  const hiddenList = useMemo(()=>ALL_ROWS.filter(r=>hidden[r[0]]),[ALL_ROWS,hidden]);
  const SECTIONS = useMemo(()=>{
    const s=[...new Set(ALL_ROWS.map(r=>r[1]))];
    return s.filter(x=>x!==CUSTOM_SECTION).concat(s.includes(CUSTOM_SECTION)?[CUSTOM_SECTION]:[]);
  },[ALL_ROWS]);
  const TAGS = useMemo(()=>[...new Set(ALL_ROWS.flatMap(r=>(r[6]||'').split(' + ').filter(Boolean)))].sort(),[ALL_ROWS]);

  const room = rooms[active];
  const c = useMemo(()=>computed(room),[room]);

  // ---- Мастера расчёта: считают материалы + подбирают нужные работы из каталога по геометрии помещения ----
  const [wizardOpen,setWizardOpen] = useState(null); // null | 'styazhka' | 'shtukaturka' | 'elektrika'
  const [copyOpen,setCopyOpen] = useState(false);
  const [copyTargets,setCopyTargets] = useState([]);
  const [wizardForm,setWizardForm] = useState({});
  function openWizard(type){
    if(type==='styazhka') setWizardForm({area:String(Math.round(c.Sпола*100)/100||''),thickness:'50',mix:'цпс',setka:true,plenka:true,mayaki:true,waste:'5'});
    else if(type==='shtukaturka') setWizardForm({area:String(Math.round(c.Sстен*100)/100||''),thickness:'15',mix:'гипс',gruntovka:true,mayaki:true,ugolki:true,corners:String(Math.round(c.Периметр*0.3*10)/10||''),waste:'5'});
    else if(type==='elektrika') setWizardForm({perimeter:String(Math.round(c.Периметр*100)/100||''),sockets:'0',switches:'0',lights:'0',power:'0',waste:'15',shtroblenie:true,gofra:true});
    setWizardOpen(type);
  }
  function closeWizard(){ setWizardOpen(null); setWizardForm({}); }
  function applyWizard(materials, works, sectionName){
    // Ищем уже существующую позицию с тем же названием/ед.изм. в том же разделе — переиспользуем её id вместо
    // создания дубля (BUG-008: повторный запуск мастера раньше плодил новые материалы при каждом клике).
    const rowsToAdd=[];
    const picksToSet=[];
    materials.forEach(m=>{
      const existing = customRows.find(r=>r[1]===sectionName && r[2]===m.name && r[3]===m.unit);
      if(existing){
        picksToSet.push({id:existing[0], qty:m.qty});
      } else {
        const id = customSeq++;
        rowsToAdd.push([id,sectionName,m.name,m.unit,'—',m.price,'Материалы','material']);
        picksToSet.push({id, qty:m.qty});
      }
    });
    if(rowsToAdd.length) setCustomRows(cs=>[...cs, ...rowsToAdd]);
    setRooms(rs=>rs.map((r,i)=>{
      if(i!==active) return r;
      const picks={...r.picks};
      picksToSet.forEach(({id,qty})=>{ picks[id]={on:true, qty:String(qty)}; });
      works.forEach(w=>{ picks[w.id]={on:true, qty:String(w.qty)}; });
      return {...r,picks};
    }));
    setOpenSection(sectionName);
    closeWizard();
  }
  function runStyazhkaWizard(f){
    const area=toNum(f.area)||0, thick=toNum(f.thickness)||0, waste=toNum(f.waste)||0;
    if(area<=0 || thick<=0){ alert('Укажите площадь пола и толщину стяжки — оба значения должны быть больше нуля.'); return; }
    const works=[], materials=[];
    if(f.mix==='наливной'){
      const weightKg = area*thick*1.6*(1+waste/100);
      materials.push({name:'Наливной пол, мешки 20 кг', unit:'мешок', qty:Math.ceil(weightKg/20), price:750});
      works.push({id:133, qty:area}); // Устройство наливного пола
    } else {
      const weightKg = (area*thick/1000)*1900*(1+waste/100);
      materials.push({name:'Смесь для стяжки (ЦПС), мешки 25 кг', unit:'мешок', qty:Math.ceil(weightKg/25), price:280});
      works.push({id:126, qty:area}); // Устройство стяжки пола
      if(f.mayaki) works.push({id:138, qty:area}); // Установка маяков стяжки
    }
    if(f.setka) works.push({id:137, qty:area}); // Монтаж армирующей сетки в стяжку
    if(f.plenka) works.push({id:135, qty:area}); // Устройство плёнки 200 мкр
    applyWizard(materials, works, 'МАТЕРИАЛЫ: СТЯЖКА');
  }
  function runShtukaturkaWizard(f){
    const area=toNum(f.area)||0, thick=toNum(f.thickness)||0, waste=toNum(f.waste)||0, corners=toNum(f.corners)||0;
    if(area<=0 || thick<=0){ alert('Укажите площадь стен и толщину слоя — оба значения должны быть больше нуля.'); return; }
    const works=[], materials=[];
    if(f.mix==='цпс'){
      const weightKg = area*thick*1.7*(1+waste/100);
      materials.push({name:'Штукатурная смесь ЦПС, мешки 25 кг', unit:'мешок', qty:Math.ceil(weightKg/25), price:320});
    } else {
      const weightKg = area*thick*0.9*(1+waste/100);
      materials.push({name:'Гипсовая штукатурка, мешки 30 кг', unit:'мешок', qty:Math.ceil(weightKg/30), price:450});
    }
    works.push({id:140, qty:area}); // Штукатурка стен по маякам
    if(f.gruntovka) works.push({id:139, qty:area}); // Грунтовка стен
    if(f.mayaki) works.push({id:148, qty:area}); // Установка маяков штукатурки
    if(f.ugolki && corners>0) works.push({id:142, qty:corners}); // Монтаж штукатурных уголков
    applyWizard(materials, works, 'МАТЕРИАЛЫ: ШТУКАТУРКА');
  }
  function runElektrikaWizard(f){
    const perimeter=toNum(f.perimeter)||0, waste=toNum(f.waste)||0;
    const sockets=Math.max(0,Math.round(toNum(f.sockets)||0));
    const switches=Math.max(0,Math.round(toNum(f.switches)||0));
    const lights=Math.max(0,Math.round(toNum(f.lights)||0));
    const power=Math.max(0,Math.round(toNum(f.power)||0));
    const lightingPoints = switches+lights;
    if(perimeter<=0 && sockets===0 && lightingPoints===0 && power===0){
      alert('Укажите периметр помещения или хотя бы одну точку (розетку/выключатель/светильник/мощный потребитель).');
      return;
    }
    // Разные группы — разные кабели и отдельные трассы (BUG-005): освещение и розетки идут отдельными
    // линиями от щита, поэтому длина считается по каждой группе отдельно, а не одним общим кабелем на всё.
    const cableRun = (points)=> Math.ceil((perimeter*1.2 + points*2.5)*(1+waste/100));
    const cableLighting = lightingPoints>0 ? cableRun(lightingPoints) : 0;
    const cableSockets = sockets>0 ? cableRun(sockets) : 0;
    // Мощная техника обычно заводится отдельным прямым заходом от щита, а не петлёй по всему периметру.
    const cablePower = power>0 ? Math.ceil((perimeter*0.6 + power*1.5)*(1+waste/100)) : 0;
    const materials=[];
    if(cableLighting>0) materials.push({name:'Кабель ВВГнг-LS 3×1,5 (освещение), м', unit:'м', qty:cableLighting, price:60});
    if(cableSockets>0) materials.push({name:'Кабель ВВГнг-LS 3×2,5 (розетки), м', unit:'м', qty:cableSockets, price:95});
    if(cablePower>0) materials.push({name:'Кабель ВВГнг-LS 3×4 (мощная техника), м', unit:'м', qty:cablePower, price:180});
    const works=[];
    if(sockets>0) works.push({id:69, qty:sockets}); // Монтаж розеток 220в
    if(switches>0) works.push({id:70, qty:switches}); // Монтаж выключателя
    if(lights>0) works.push({id:71, qty:lights}); // Монтаж светильников
    if(sockets+switches>0){ works.push({id:67, qty:sockets+switches}); works.push({id:68, qty:sockets+switches}); } // Сверление/монтаж подрозетников
    const totalCable = cableLighting+cableSockets+cablePower;
    if(f.shtroblenie && perimeter>0) works.push({id:63, qty:Math.round(perimeter*0.5)}); // Штробление стен (≈50% периметра)
    if(f.gofra && totalCable>0) works.push({id:62, qty:totalCable}); // Заведение проводки в гофру
    applyWizard(materials, works, 'МАТЕРИАЛЫ: ЭЛЕКТРИКА');
  }

  }
  function hideRow(rowId){
    setHidden(h=>({...h,[rowId]:true}));
    const usedInRooms = rooms.filter(r=>r.picks[rowId]&&r.picks[rowId].on).length;
    if(usedInRooms>0){
      showUndo(`Скрыто из каталога — позиция уже отмечена в ${usedInRooms} помещении(ях) и останется в расчёте`, ()=>{
        setHidden(h=>{ const n={...h}; delete n[rowId]; return n; });
      });
    }
  }
  function restoreRow(rowId){ setHidden(h=>{ const n={...h}; delete n[rowId]; return n; }); }
  function deleteCustomRow(rowId,name){
    const row = customRows.find(r=>r[0]===rowId);
    if(!row) return;
    setCustomRows(cs=>cs.filter(r=>r[0]!==rowId));
    setHidden(h=>{ if(!h[rowId]) return h; const n={...h}; delete n[rowId]; return n; });
    showUndo(`Позиция «${name}» удалена`, ()=>{
      setCustomRows(cs=> cs.some(r=>r[0]===rowId) ? cs : [...cs, row]);
    });
  }

  function openAdd(){ setForm(emptyForm); setEditingId('new'); }
  function openEdit(row){
    setForm({name:row[2],unit:row[3],priv:row[4],price:row[5]==null?'':row[5],tag:row[6]||'Прочее',kind:row[7]||'work'});
    setEditingId(row[0]);
  }
  function duplicateAsNew(row){
    setForm({name:row[2],unit:row[3],priv:row[4],price:row[5]==null?'':row[5],tag:row[6]||'Прочее',kind:row[7]||'work'});
    setEditingId('new');
  }
  function closeForm(){ setEditingId(null); setForm(emptyForm); }
  function submitForm(){
    if(!form.name.trim()) return;
    const priceVal = form.price===''?null:toNum(form.price);
    if(priceVal!=null && isNaN(priceVal)){
      alert('Цена указана не числом. Проверьте поле «Цена, ₽» — например: 1500 или 1500,50.');
      return;
    }
    if(priceVal!=null && priceVal<0){
      alert('Цена не может быть отрицательной.');
      return;
    }
    const kindVal = form.kind==='material'?'material':'work';
    if(editingId==='new'){
      const id = customSeq++;
      setCustomRows(cs=>[...cs,[id,CUSTOM_SECTION,form.name.trim(),form.unit||'шт',form.priv,priceVal,form.tag||'Прочее',kindVal]]);
    } else if(typeof editingId==='number' && editingId>=100000){
      setCustomRows(cs=>cs.map(r=> r[0]===editingId ? [r[0],r[1],form.name.trim(),form.unit||'шт',form.priv,priceVal,form.tag||'Прочее',kindVal] : r));
    } else if(typeof editingId==='number'){
      setOverrides(o=>({...o,[editingId]:{name:form.name.trim(),unit:form.unit||'шт',priv:form.priv,price:priceVal,tag:form.tag||'Прочее',kind:kindVal}}));
    }
    closeForm();
  }
  function resetOverride(){
    if(typeof editingId==='number' && editingId<100000){
      setOverrides(o=>{ const n={...o}; delete n[editingId]; return n; });
    }
    closeForm();
  }

  const filtered = useMemo(()=>{
    let rows = visibleRows;
    if(tagFilter!=='Все') rows = rows.filter(r=>(r[6]||'').split(' + ').includes(tagFilter));
    if(search.trim()) rows = rows.filter(r=>r[2].toLowerCase().includes(search.trim().toLowerCase()));
    return rows;
  },[visibleRows,tagFilter,search]);

  const grouped = useMemo(()=>{
    return SECTIONS.map(s=>[s,filtered.filter(r=>r[1]===s)]).filter(([,rs])=>rs.length);
  },[filtered,SECTIONS]);

  function roomPickedItems(rm){
    const cc=computed(rm); const items=[];
    for(const row of ALL_ROWS){ // намеренно ALL_ROWS, а не visibleRows — «скрыть» прячет позицию из каталога при просмотре, но не должно тихо убирать уже отмеченную стоимость из расчёта (см. BUG-009)
      const pick = rm.picks[row[0]]; if(!pick||!pick.on) continue;
      const [id,section,name,unit,priv,price,,kind] = row;
      const qty = pick.qty!=='' && pick.qty!=null ? toNum(pick.qty) : autoQty(priv,cc);
      if(qty==null||isNaN(qty)||qty<0) continue;
      items.push({id,section,name,unit,qty,price,kind:kind||'work',sum: price!=null? qty*price : null});
    }
    return items;
  }
  function roomTotal(rm){
    const items = roomPickedItems(rm);
    const sum = items.reduce((a,i)=>a+(i.sum||0),0);
    const workSum = items.reduce((a,i)=>a+(i.kind==='material'?0:(i.sum||0)),0);
    const materialSum = items.reduce((a,i)=>a+(i.kind==='material'?(i.sum||0):0),0);
    const missing = items.filter(i=>i.sum==null).length;
    return {sum,workSum,materialSum,missing,items};
  }
  // Группировка позиций одного помещения по разделу (виду работ) — для печати и Excel.
  function groupBySection(items){
    const map = new Map();
    items.forEach(it=>{
      const key = it.section||'Без раздела';
      if(!map.has(key)) map.set(key,[]);
      map.get(key).push(it);
    });
    return [...map.entries()];
  }
  // Свод по видам работ сразу по всем помещениям — сколько стоит демонтаж/электрика/полы и т.д. в целом по объекту.
  function workTypeSummary(){
    const map = new Map();
    rooms.forEach(rm=>{
      roomPickedItems(rm).forEach(it=>{
        const key = it.section||'Без раздела';
        if(!map.has(key)) map.set(key,{sum:0,count:0});
        const e = map.get(key);
        e.sum += (it.sum||0);
        e.count += 1;
      });
    });
    return [...map.entries()].map(([section,v])=>({section,sum:v.sum,count:v.count}));
  }

  const totals = rooms.map(roomTotal);
  const grand = totals.reduce((a,t)=>a+t.sum,0);
  const grandWork = totals.reduce((a,t)=>a+t.workSum,0);
  const grandMaterial = totals.reduce((a,t)=>a+t.materialSum,0);
  const totalMissing = totals.reduce((a,t)=>a+t.missing,0);
  const withDiscount = grand*(1-discount/100);
  const pickedCount = totals.reduce((a,t)=>a+t.items.length,0);

  // ---- Счёт на оплату: отдельный документ, собранный из уже готовой сметы ----
  const [printMode,setPrintMode] = useState('smeta'); // 'smeta' | 'invoice'
  const [invoiceOpen,setInvoiceOpen] = useState(false);
  const [invoiceForm,setInvoiceForm] = useState(null);
  function openInvoice(){
    setInvoiceForm(f=>({
      number: f?.number || '1',
      date: f?.date || new Date().toISOString().slice(0,10),
      supplierName: f?.supplierName ?? (objName||''),
      supplierInn: f?.supplierInn || '',
      buyerName: f?.buyerName || '',
      buyerInn: f?.buyerInn || '',
      vatMode: f?.vatMode || 'none', // none | included | on_top
      vatRate: f?.vatRate || '20',
    }));
    setInvoiceOpen(true);
  }
  function closeInvoice(){ setInvoiceOpen(false); }
  function invoiceItems(){
    const map = new Map();
    rooms.forEach(rm=>{
      roomPickedItems(rm).forEach(it=>{
        const key = it.name+'|'+it.unit+'|'+(it.price==null?'null':it.price);
        if(map.has(key)){
          const prev = map.get(key);
          prev.qty += it.qty;
          prev.sum = prev.price!=null ? prev.qty*prev.price : null;
        } else {
          map.set(key, {name:it.name, unit:it.unit, qty:it.qty, price:it.price, sum:it.sum});
        }
      });
    });
    return [...map.values()];
  }
  function invoiceVat(total, form){
    const rate = toNum(form.vatRate)||0;
    if(form.vatMode==='included') return {vat: total*rate/(100+rate), payable: total};
    if(form.vatMode==='on_top') return {vat: total*rate/100, payable: total*(1+rate/100)};
    return {vat:0, payable: total};
  }
  function printInvoice(){ setPrintMode('invoice'); setInvoiceOpen(false); setTimeout(()=>window.print(),60); }
  function printSmeta(){ setPrintMode('smeta'); setTimeout(()=>window.print(),60); }

  function copyText(){
    let lines=[`СМЕТА — ${objName}`, ...(objMeta.trim()?[objMeta.trim()]:[]), ''];
    rooms.forEach((rm,i)=>{
      const cc=computed(rm);
      lines.push(`${rm.name.toUpperCase()}  (S пола ${fmt2(cc.Sпола)} м², периметр ${fmt2(cc.Периметр)} м, S стен ${fmt2(cc.Sстен)} м²)`);
      const items = totals[i].items;
      if(!items.length) lines.push('  (работы не выбраны)');
      items.forEach(it=>{
        lines.push(`  ${it.name} — ${fmt2(it.qty)} ${it.unit} × ${it.price!=null?fmt(it.price)+'₽':'цена?'} = ${it.sum!=null?fmt(it.sum)+'₽':'—'}`);
      });
      lines.push(`  Итого по помещению: ${fmt(totals[i].sum)} ₽`,'');
    });
    lines.push(`СУММА РАБОТ: ${fmt(grandWork)} ₽`);
    lines.push(`СУММА МАТЕРИАЛОВ: ${fmt(grandMaterial)} ₽`);
    lines.push(`ИТОГО ПО СМЕТЕ: ${fmt(grand)} ₽`);
    if(discount>0) lines.push(`Скидка клиенту ${discount}%: −${fmt(grand*discount/100)} ₽`);
    lines.push(`ИТОГО К ОПЛАТЕ: ${fmt(withDiscount)} ₽`);
    lines.push(`Сумма прописью: ${rubToWords(withDiscount)}`);
    navigator.clipboard?.writeText(lines.join('\n')).then(()=>alert('Смета скопирована в буфер обмена'))
      .catch(()=>alert('Не удалось скопировать — браузер заблокировал доступ к буферу.'));
  }

  function safeSheetName(name, used){
    let base = String(name||'Без имени').replace(/[:\\\/\?\*\[\]]/g,'').trim().slice(0,28) || 'Помещение';
    let candidate = base, n = 2;
    while(used.has(candidate)){ candidate = `${base} ${n}`.slice(0,31); n++; }
    used.add(candidate);
    return candidate;
  }

  function exportExcel(){
    if(typeof XLSX==='undefined'){
      alert('Не удалось загрузить библиотеку Excel-экспорта. Проверьте подключение к интернету и попробуйте снова.');
      return;
    }
    const wb = XLSX.utils.book_new();

    const summaryRows = [
      [`СМЕТА — ${objName}`],
      ...(objMeta.trim() ? [[objMeta.trim()]] : []),
      [],
      ['Помещение','Позиций','Сумма, ₽'],
    ];
    rooms.forEach((r,i)=>{ summaryRows.push([r.name, totals[i].items.length, Math.round(totals[i].sum*100)/100]); });
    summaryRows.push([]);
    summaryRows.push(['СУММА РАБОТ','', Math.round(grandWork*100)/100]);
    summaryRows.push(['СУММА МАТЕРИАЛОВ','', Math.round(grandMaterial*100)/100]);
    summaryRows.push(['ИТОГО ПО СМЕТЕ','', Math.round(grand*100)/100]);
    if(discount>0) summaryRows.push([`Скидка клиенту ${discount}%`,'', -Math.round(grand*discount/100*100)/100]);
    summaryRows.push(['ИТОГО К ОПЛАТЕ','', Math.round(withDiscount*100)/100]);
    summaryRows.push([]);
    summaryRows.push(['Сумма прописью:', rubToWords(withDiscount)]);
    const summarySheet = XLSX.utils.aoa_to_sheet(summaryRows);
    summarySheet['!cols'] = [{wch:28},{wch:12},{wch:16}];
    XLSX.utils.book_append_sheet(wb, summarySheet, 'Итого');

    const usedNames = new Set(['Итого']);

    const wts = workTypeSummary();
    if(wts.length){
      const wtsRows = [['Раздел (вид работ)','Позиций','Сумма, ₽']];
      wts.forEach(w=>wtsRows.push([w.section, w.count, Math.round(w.sum*100)/100]));
      wtsRows.push([]);
      wtsRows.push(['ИТОГО','', Math.round(grand*100)/100]);
      const wtsSheet = XLSX.utils.aoa_to_sheet(wtsRows);
      wtsSheet['!cols'] = [{wch:32},{wch:12},{wch:16}];
      XLSX.utils.book_append_sheet(wb, wtsSheet, 'Свод по видам работ');
      usedNames.add('Свод по видам работ');
    }

    rooms.forEach((r,i)=>{
      const items = totals[i].items;
      const rows = [['Раздел','Наименование','Ед. изм.','Количество','Цена, ₽','Сумма, ₽','Тип']];
      if(!items.length){
        rows.push(['(работы не выбраны)']);
      } else {
        groupBySection(items).forEach(([section,groupItems])=>{
          rows.push([section.toUpperCase()]);
          groupItems.forEach(it=>{
            const q = it.qty!=null ? Math.round(it.qty*100)/100 : '';
            const p = it.price!=null ? it.price : '';
            const s = it.sum!=null ? Math.round(it.sum*100)/100 : '';
            rows.push([it.section||'', it.name, it.unit, q, p, s, it.kind==='material'?'Материал':'Работа']);
          });
          const groupSum = groupItems.reduce((a,it)=>a+(it.sum||0),0);
          rows.push(['','','','','Итого по разделу:', Math.round(groupSum*100)/100]);
          rows.push([]);
        });
      }
      rows.push(['','','','','Итого по помещению:', Math.round(totals[i].sum*100)/100]);
      const sheet = XLSX.utils.aoa_to_sheet(rows);
      sheet['!cols'] = [{wch:24},{wch:42},{wch:10},{wch:12},{wch:12},{wch:12},{wch:10}];
      XLSX.utils.book_append_sheet(wb, sheet, safeSheetName(r.name, usedNames));
    });

    const safeObjName = (objName||'smeta').replace(/[^\wа-яА-ЯёЁ\- ]/g,'').trim().replace(/\s+/g,'_') || 'smeta';
    XLSX.writeFile(wb, `${safeObjName}_${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  const isFormOpen = editingId!==null;
  const isEditingCatalogItem = typeof editingId==='number' && editingId<100000;
  const isEditingBase = isEditingCatalogItem && overrides[editingId];
  const baseCatalogRow = isEditingBase ? BASE_CATALOG.find(r=>r[0]===editingId) : null;
  const baseCatalogPrice = baseCatalogRow ? baseCatalogRow[5] : null;
  const currentFormPrice = form.price!==''? toNum(form.price) : null;

  // Обычный сценарий (без поиска и без тега) идёт через выбор этапа: пользователю не нужно
  // сразу видеть все 200+ позиций каталога — только когда он ищет или фильтрует по тегу.
  const browsingMode = !search.trim() && tagFilter==='Все';
  const sectionSummary = useMemo(()=>SECTIONS.map(s=>{
    const rowsInSection = visibleRows.filter(r=>r[1]===s);
    const picked = rowsInSection.filter(r=>room.picks[r[0]]&&room.picks[r[0]].on).length;
    return {name:s, total:rowsInSection.length, picked};
  }),[SECTIONS,visibleRows,room]);

  // Автодополнение по названию: живая подсказка при вводе, чтобы не листать открытый этап целиком.
  const searchSuggestions = useMemo(()=>{
    const q = search.trim().toLowerCase();
    if(!q) return [];
    return visibleRows.filter(r=>r[2].toLowerCase().includes(q)).slice(0,8);
  },[visibleRows,search]);
  const [highlightId,setHighlightId] = useState(null);
  function pickSuggestion(row){
    selectRow(row[0]);
    setOpenSection(row[1]);
    setSearch('');
    setTagFilter('Все'); // иначе если активен тег, не включающий эту позицию, она не попадёт в видимый список и прокрутка молча не сработает
    setHighlightId(row[0]);
  }
  useEffect(()=>{
    if(highlightId==null) return;
    const t1 = setTimeout(()=>{
      const rowEl = document.getElementById('row-'+highlightId);
      if(rowEl){
        rowEl.scrollIntoView({behavior:'smooth', block:'center'});
        const qtyEl = document.getElementById('qty-'+highlightId);
        if(qtyEl){ qtyEl.focus(); qtyEl.select && qtyEl.select(); }
      }
    }, 60); // небольшая задержка, чтобы раздел успел отрисоваться в DOM после выбора через поиск
    const t2 = setTimeout(()=>setHighlightId(null), 2500);
    return ()=>{ clearTimeout(t1); clearTimeout(t2); };
  },[highlightId]);

  function renderRow(row){
    const [id,,name,unit,priv,price] = row;
    const isCustom = id>=100000;
    const isOverridden = !isCustom && overrides[id];
    const origPrice = isOverridden ? (BASE_CATALOG.find(r=>r[0]===id)||[])[5] : null;
    const pick = room.picks[id]; const on = pick&&pick.on;
    const qVal = on ? (pick.qty!==''&&pick.qty!=null?pick.qty:'') : '';
    const auto = autoQty(priv,c);
    const qty = qVal!==''?toNum(qVal):auto;
    const qtyInvalid = qVal!=='' && (isNaN(qty) || qty<0);
    const sum = (on&&!qtyInvalid&&qty!=null&&!isNaN(qty)&&price!=null) ? qty*price : null;
    return (
      <div key={id} id={"row-"+id} className={"row"+(on?' checked':'')+(isCustom?' custom':'')+(isOverridden?' overridden':'')+(highlightId===id?' highlight':'')}>
        <div className="rmain">
          <div className={"chk"+(on?' on':'')} role="checkbox" aria-checked={!!on} tabIndex={0}
            onClick={()=>toggleRow(id)}
            onKeyDown={e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggleRow(id); } }}>{on?'✓':''}</div>
          <div className="rname">{name}
            {isCustom && <span className="badge">своя</span>}
            {isOverridden && <span className="badge edit" title={`Цена каталога: ${origPrice!=null?fmt(origPrice)+' ₽':'—'} · Цена в этой смете: ${price!=null?fmt(price)+' ₽':'—'}`}>изменена</span>}
          </div>
          <div className="ractions">
            <button className="ricon dup" title="Добавить похожую позицию" aria-label={`Добавить позицию похожую на: ${name}`} onClick={()=>duplicateAsNew(row)}>+</button>
            <button className="ricon edit" title="Изменить" aria-label={`Изменить: ${name}`} onClick={()=>openEdit(row)}>✎</button>
            <button className="ricon del"
              title={isCustom?'Удалить (можно отменить)':'Скрыть (можно вернуть в панели «Скрытые»)'}
              aria-label={isCustom?`Удалить позицию: ${name}`:`Скрыть позицию: ${name}`}
              onClick={()=> isCustom ? deleteCustomRow(id,name) : hideRow(id)}>{isCustom?'🗑':'⊖'}</button>
          </div>
        </div>
        <div className="rmeta">
          <span className="runit">{unit}</span>
          <span className="rqty">
            <input id={"qty-"+id} type="text" inputMode="decimal" placeholder={auto!=null?fmt2(auto):'—'}
              className={(qVal===''?'auto':'')+(qtyInvalid?' invalid':'')} value={qVal} disabled={!on}
              title={qtyInvalid?'Количество должно быть числом ≥ 0':undefined}
              onChange={e=>setQty(id,e.target.value)}/>
          </span>
          <span className={"rprice"+(price==null?' missing':'')}>{price!=null?fmt(price)+' ₽':'нет цены'}</span>
          <span className={"rsum"+(qtyInvalid?' invalid':'')}>{sum!=null?fmt(sum)+' ₽':(qtyInvalid?'проверьте кол-во':'—')}</span>
        </div>
      </div>
    );
  }

  return (
    <>
      <div className="topbar">
        <div className="topbar-inner">
          <div className="brand">
            <div className="brand-mark"></div>
            <h1>Смета</h1>
            <span>калькулятор · {visibleRows.length} позиций{hiddenList.length>0?` · скрыто ${hiddenList.length}`:''}</span>
            <div className="topbar-tools">
              <button className="btn-tool" onClick={undo} disabled={!canUndo} title="Отменить последнее изменение (Ctrl+Z)">↶ Отменить</button>
              <button className="btn-tool" onClick={redo} disabled={!canRedo} title="Повторить отменённое изменение (Ctrl+Shift+Z)">↷ Повторить</button>
              <button className="tools-toggle" onClick={()=>setToolsExpanded(v=>!v)}>{toolsExpanded?'Скрыть ✕':'⋯ Ещё'}</button>
              <div className={"tools-extra"+(toolsExpanded?' open':'')}>
                <span className="save-indicator" title="Данные хранятся в памяти этого браузера на этом устройстве. Чтобы открыть смету в другом браузере или на другом устройстве — используйте «Экспорт» и «Импорт».">{lastSaved?'✓ Сохранено на этом устройстве':''}</span>
                <span className="tools-group-label">Смета:</span>
                <input type="file" accept="application/json" ref={importInputRef} style={{display:'none'}} onChange={handleImportFile}/>
                <button className="btn-tool" onClick={exportData} title="Скачать файл сметы (.json) — можно открыть на другом устройстве или сохранить как резервную копию">Экспорт JSON</button>
                <button className="btn-tool" onClick={exportExcel} title="Скачать смету в формате Excel (.xlsx) — сводка + отдельный лист на каждое помещение">Excel</button>
                <button className="btn-tool" onClick={triggerImport} title="Загрузить смету из ранее экспортированного файла .json">Импорт</button>
                <button className="btn-tool" onClick={()=>setProjectsOpen(true)} title="Список всех смет в этом браузере — переключиться, создать новую или удалить">📁 Мои сметы</button>
                <span className="tools-group-label">Прайс-лист:</span>
                <input type="file" accept="application/json" ref={importPriceListInputRef} style={{display:'none'}} onChange={handleImportPriceListFile}/>
                <input type="file" accept=".xlsx" ref={importPriceListExcelInputRef} style={{display:'none'}} onChange={handleImportPriceListExcel}/>
                <button className="btn-tool" onClick={exportPriceList} title="Скачать только изменённые цены, свои позиции и скрытые из каталога в JSON — без привязки к конкретному объекту">Экспорт JSON</button>
                <button className="btn-tool" onClick={exportPriceListExcel} title="Скачать прайс-лист в формате Excel — удобно массово править цены">Экспорт Excel</button>
                <button className="btn-tool" onClick={triggerImportPriceList} title="Загрузить прайс-лист из ранее экспортированного файла .json">Импорт JSON</button>
                <button className="btn-tool" onClick={triggerImportPriceListExcel} title="Загрузить прайс-лист из отредактированного файла Excel">Импорт Excel</button>
                <button className="btn-tool btn-newproj" onClick={resetPriceList} title="Вернуть каталог к заводским ценам и составу, убрать свои позиции и скрытые">Сбросить прайс-лист</button>
              </div>
            </div>
